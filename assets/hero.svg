<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Adithya S — cyberdeck profile</title>
  <desc id="heroDesc">A dark terminal panel reads: electronics and communication engineer, building small hardware and software projects, still learning.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121A"/>
      <stop offset="0.55" stop-color="#05080D"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.25" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#00E5FF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1B4A5C" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#FF5C8A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0E2634" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.018"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="termClip">
      <rect x="41" y="64" width="1038" height="267"/>
    </clipPath>

    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      }

      .frame-line {
        animation: framePulse 5s ease-in-out infinite;
      }

      .scanline {
        animation: scan 7s linear infinite;
      }

      .cursor {
        animation: blink 1.1s steps(1, end) infinite;
      }

      .status-led {
        animation: blink 1.8s steps(1, end) infinite;
      }

      .glitch-red {
        animation: glitchRed 6s infinite;
      }

      .glitch-cyan {
        animation: glitchCyan 6s infinite;
      }

      .wave {
        stroke-dasharray: 4 6;
        animation: dash 1.2s linear infinite;
      }

      .bar {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: eq 1.1s ease-in-out infinite alternate;
      }

      .b1  { animation-delay: -0.10s; animation-duration: 1.05s; }
      .b2  { animation-delay: -0.55s; animation-duration: 0.90s; }
      .b3  { animation-delay: -0.25s; animation-duration: 1.20s; }
      .b4  { animation-delay: -0.75s; animation-duration: 0.95s; }
      .b5  { animation-delay: -0.35s; animation-duration: 1.30s; }
      .b6  { animation-delay: -0.05s; animation-duration: 1.10s; }
      .b7  { animation-delay: -0.65s; animation-duration: 0.85s; }
      .b8  { animation-delay: -0.15s; animation-duration: 1.25s; }
      .b9  { animation-delay: -0.85s; animation-duration: 1.00s; }
      .b10 { animation-delay: -0.45s; animation-duration: 1.15s; }
      .b11 { animation-delay: -0.20s; animation-duration: 0.92s; }
      .b12 { animation-delay: -0.70s; animation-duration: 1.28s; }
      .b13 { animation-delay: -0.30s; animation-duration: 1.02s; }
      .b14 { animation-delay: -0.60s; animation-duration: 1.18s; }
      .b15 { animation-delay: -0.40s; animation-duration: 0.88s; }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes scan {
        0%   { transform: translateY(-110px); }
        100% { transform: translateY(440px); }
      }

      @keyframes framePulse {
        0%, 100% { opacity: 0.7; }
        50%      { opacity: 1; }
      }

      @keyframes glitchRed {
        0%, 91%, 100% { transform: translate(0, 0); opacity: 0.35; }
        92%           { transform: translate(-3px, 1px); opacity: 0.55; }
        94%           { transform: translate(2px, -1px); opacity: 0.45; }
        96%           { transform: translate(-1px, 2px); opacity: 0.4; }
        98%           { transform: translate(1px, -1px); opacity: 0.5; }
      }

      @keyframes glitchCyan {
        0%, 91%, 100% { transform: translate(0, 0); opacity: 0.3; }
        92%           { transform: translate(3px, -1px); opacity: 0.5; }
        94%           { transform: translate(-2px, 1px); opacity: 0.4; }
        96%           { transform: translate(1px, -2px); opacity: 0.35; }
        98%           { transform: translate(-1px, 1px); opacity: 0.45; }
      }

      @keyframes dash {
        to { stroke-dashoffset: -56; }
      }

      @keyframes eq {
        from { transform: scaleY(0.22); }
        to   { transform: scaleY(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .frame-line, .scanline, .cursor, .status-led,
        .glitch-red, .glitch-cyan, .wave, .bar {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1120" height="360" fill="url(#bg)"/>
  <rect width="1120" height="360" fill="url(#grid)" opacity="0.5"/>
  <rect width="1120" height="360" fill="url(#halo)"/>

  <g fill="none" stroke="#0B3444" stroke-width="1" opacity="0.8">
    <path d="M0 318H132L168 282H262L296 248"/>
    <path d="M1120 86H1010L974 122H900"/>
    <path d="M0 72H64L96 104V148"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="132" cy="318" r="2" opacity="0.45"/>
    <circle cx="168" cy="282" r="2" opacity="0.3"/>
    <circle cx="262" cy="282" r="2" opacity="0.45"/>
    <circle cx="1010" cy="86" r="2" opacity="0.3"/>
    <circle cx="974" cy="122" r="2" opacity="0.45"/>
    <circle cx="96" cy="104" r="2" opacity="0.3"/>
  </g>

  <rect x="40" y="28" width="1040" height="304" rx="12" fill="#060B11"/>
  <rect x="40" y="28" width="1040" height="304" rx="12" fill="none" stroke="url(#frameGrad)" stroke-width="1.5" class="frame-line"/>
  <rect x="44" y="32" width="1032" height="296" rx="9" fill="none" stroke="#0D2633"/>

  <path d="M52 28H1068A12 12 0 0 1 1080 40V64H40V40A12 12 0 0 1 52 28Z" fill="#0A141C"/>
  <line x1="40" y1="64" x2="1080" y2="64" stroke="#12303F"/>

  <g filter="url(#softGlow)" opacity="0.5">
    <circle cx="64" cy="46" r="7" fill="#FF5F57"/>
    <circle cx="82" cy="46" r="7" fill="#FEBC2E"/>
    <circle cx="100" cy="46" r="7" fill="#28C840"/>
  </g>
  <circle cx="64" cy="46" r="4.5" fill="#FF5F57"/>
  <circle cx="82" cy="46" r="4.5" fill="#FEBC2E"/>
  <circle cx="100" cy="46" r="4.5" fill="#28C840"/>

  <text x="560" y="51" text-anchor="middle" font-size="12" letter-spacing="2" fill="#5F8496">adithya@cyberdeck: ~/profile</text>
  <text x="1050" y="51" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#31505F">TTY0 / 0x119</text>

  <rect x="41" y="64" width="1038" height="267" fill="#050A0F" opacity="0.55"/>

  <g clip-path="url(#termClip)">
    <rect x="40" y="64" width="1040" height="268" fill="url(#scan)"/>
    <g class="scanline">
      <rect x="40" y="-80" width="1040" height="90" fill="url(#sweep)"/>
    </g>
  </g>

  <text x="72" y="94" font-size="12" letter-spacing="2" fill="#4E7A8C">[ <tspan fill="#7CFFB2">OK</tspan> ] PROFILE MOUNTED <tspan fill="#2E5A6A">/ DEV/0X119</tspan></text>

  <g font-size="52" font-weight="700" letter-spacing="4">
    <text class="glitch-red" x="72" y="154" fill="#FF2E6A">ADITHYA S</text>
    <text class="glitch-cyan" x="72" y="154" fill="#00E5FF">ADITHYA S</text>
    <text x="72" y="154" fill="#E8FAFF">ADITHYA <tspan fill="#00E5FF">S</tspan></text>
  </g>

  <rect x="72" y="165" width="306" height="2" fill="#00E5FF" opacity="0.3"/>
  <rect x="382" y="163" width="6" height="6" fill="#00E5FF" opacity="0.85"/>

  <text x="72" y="198" font-size="18" letter-spacing="1.5" fill="#7CFFB2">electronics &amp; communication engineer</text>
  <text x="72" y="226" font-size="15" letter-spacing="0.5" fill="#8FA9B8">building small hardware + software projects. still learning.</text>

  <g>
    <rect x="760" y="86" width="296" height="146" rx="4" fill="#071019" stroke="#123A4A"/>
    <path d="M760 98V86H772" fill="none" stroke="#00E5FF" stroke-opacity="0.55"/>
    <path d="M1044 86H1056V98" fill="none" stroke="#00E5FF" stroke-opacity="0.55"/>
    <path d="M760 220V232H772" fill="none" stroke="#00E5FF" stroke-opacity="0.55"/>
    <path d="M1044 232H1056V220" fill="none" stroke="#00E5FF" stroke-opacity="0.55"/>

    <text x="776" y="106" font-size="10" letter-spacing="2" fill="#4E7A8C">SIGNAL // MONITOR</text>
    <text x="1040" y="106" text-anchor="end" font-size="10" letter-spacing="1" fill="#7CFFB2">LIVE</text>
    <circle class="status-led" cx="1028" cy="102" r="2.5" fill="#7CFFB2"/>

    <path class="wave" d="M776 138H800L808 128L816 150L824 134L832 146L840 138H852L860 126L868 152L876 136L884 144L892 138H916" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.5"/>

    <line x1="776" y1="192" x2="1040" y2="192" stroke="#123A4A"/>

    <g>
      <rect class="bar b1"  x="776"  y="176" width="8" height="16" fill="#00E5FF" opacity="0.9"/>
      <rect class="bar b2"  x="793"  y="164" width="8" height="28" fill="#00E5FF" opacity="0.8"/>
      <rect class="bar b3"  x="810"  y="182" width="8" height="10" fill="#00E5FF" opacity="0.7"/>
      <rect class="bar b4"  x="827"  y="158" width="8" height="34" fill="#00E5FF" opacity="0.9"/>
      <rect class="bar b5"  x="844"  y="170" width="8" height="22" fill="#FF5C8A" opacity="0.75"/>
      <rect class="bar b6"  x="861"  y="152" width="8" height="40" fill="#00E5FF" opacity="0.85"/>
      <rect class="bar b7"  x="878"  y="178" width="8" height="14" fill="#00E5FF" opacity="0.7"/>
      <rect class="bar b8"  x="895"  y="162" width="8" height="30" fill="#00E5FF" opacity="0.9"/>
      <rect class="bar b9"  x="912"  y="174" width="8" height="18" fill="#00E5FF" opacity="0.75"/>
      <rect class="bar b10" x="929"  y="154" width="8" height="38" fill="#FF5C8A" opacity="0.7"/>
      <rect class="bar b11" x="946"  y="180" width="8" height="12" fill="#00E5FF" opacity="0.8"/>
      <rect class="bar b12" x="963"  y="166" width="8" height="26" fill="#00E5FF" opacity="0.9"/>
      <rect class="bar b13" x="980"  y="172" width="8" height="20" fill="#00E5FF" opacity="0.75"/>
      <rect class="bar b14" x="997"  y="160" width="8" height="32" fill="#00E5FF" opacity="0.85"/>
      <rect class="bar b15" x="1014" y="176" width="8" height="16" fill="#FF5C8A" opacity="0.7"/>
    </g>

    <text x="1040" y="218" text-anchor="end" font-size="9" letter-spacing="1.5" fill="#31505F">DSP / AUDIO / 0X119</text>
  </g>

  <line x1="72" y1="248" x2="1048" y2="248" stroke="#0D2633"/>

  <text x="72" y="284" font-size="14" fill="#7CFFB2">adithya@cyberdeck<tspan fill="#5F8496">:~$</tspan></text>
  <rect class="cursor" x="250" y="270" width="9" height="17" fill="#00E5FF"/>

  <line x1="72" y1="302" x2="1048" y2="302" stroke="#0D2633"/>
  <text x="72" y="318" font-size="11" letter-spacing="1.5" fill="#3F6475">MODE: LEARNING BY BUILDING</text>
  <text x="1048" y="318" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#3F6475">// EOF</text>
</svg>
