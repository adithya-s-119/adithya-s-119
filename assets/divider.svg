<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 28" width="1120" height="28" role="img" aria-label="Circuit divider">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .pulse {
        animation: travel 6.5s linear infinite;
      }
      @keyframes travel {
        from { transform: translateX(-180px); }
        to   { transform: translateX(1300px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <line x1="0" y1="14" x2="1120" y2="14" stroke="#12303F"/>
  <g fill="#1B4557">
    <rect x="0" y="11" width="2" height="6"/>
    <rect x="279" y="12" width="2" height="4" opacity="0.6"/>
    <rect x="559" y="11" width="2" height="6"/>
    <rect x="839" y="12" width="2" height="4" opacity="0.6"/>
    <rect x="1118" y="11" width="2" height="6"/>
  </g>

  <g class="pulse">
    <rect x="0" y="13" width="180" height="2" fill="url(#pulseGrad)"/>
    <circle cx="90" cy="14" r="4" fill="#00E5FF" opacity="0.55" filter="url(#pulseGlow)"/>
    <circle cx="90" cy="14" r="1.8" fill="#E8FAFF"/>
  </g>
</svg>
