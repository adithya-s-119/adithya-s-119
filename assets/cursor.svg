<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 18" width="9" height="18" role="img" aria-label="Blinking cursor">
  <defs>
    <style>
      .cursor {
        animation: blink 1.1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; }
      }
    </style>
  </defs>
  <rect class="cursor" width="9" height="18" fill="#00E5FF"/>
</svg>
