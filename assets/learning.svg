<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 142" width="1120" height="142" role="img" aria-labelledby="learnTitle learnDesc">
  <title id="learnTitle">Currently learning</title>
  <desc id="learnDesc">A terminal panel lists: FPGA design, DSP, and analog / mixed-signal PCB design.</desc>

  <defs>
    <pattern id="learnScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.018"/>
    </pattern>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      }

      .reveal {
        animation: reveal 0.65s steps(28, end) both;
      }

      .l1 { animation-delay: 0.15s; }
      .l2 { animation-delay: 0.95s; }
      .l3 { animation-delay: 1.75s; }

      .cursor {
        animation: blink 1.1s steps(1, end) infinite;
      }

      .status-led {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes reveal {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0 0 0); }
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal, .cursor, .status-led {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="141" rx="6" fill="#060B11" stroke="#12303F"/>
  <rect x="0" y="0" width="4" height="142" rx="2" fill="#FFB86B" opacity="0.8"/>
  <rect x="1" y="1" width="1118" height="140" rx="6" fill="url(#learnScan)"/>

  <path d="M14 14V6H22" fill="none" stroke="#FFB86B" stroke-opacity="0.5"/>
  <path d="M1098 6H1106V14" fill="none" stroke="#FFB86B" stroke-opacity="0.5"/>
  <path d="M14 128V136H22" fill="none" stroke="#FFB86B" stroke-opacity="0.5"/>
  <path d="M1098 136H1106V128" fill="none" stroke="#FFB86B" stroke-opacity="0.5"/>

  <text x="28" y="34" font-size="12" letter-spacing="2" fill="#7CFFB2">&gt; currently_learning</text>
  <rect class="cursor" x="196" y="22" width="7" height="14" fill="#7CFFB2" opacity="0.9"/>
  <text x="1092" y="34" text-anchor="end" font-size="10" letter-spacing="2" fill="#31505F">[ OPEN LOOP ]</text>

  <line x1="28" y1="48" x2="1092" y2="48" stroke="#12303F"/>

  <g font-size="15">
    <text class="reveal l1" x="28" y="76" fill="#C9DDE8"><tspan fill="#00E5FF">&#9656;</tspan> fpga design</text>
    <text class="reveal l2" x="28" y="100" fill="#C9DDE8"><tspan fill="#00E5FF">&#9656;</tspan> dsp</text>
    <text class="reveal l3" x="28" y="124" fill="#C9DDE8"><tspan fill="#00E5FF">&#9656;</tspan> analog / mixed-signal pcb design</text>
  </g>

  <circle class="status-led" cx="1004" cy="76" r="2.5" fill="#FFB86B"/>
  <text x="1016" y="80" font-size="10" letter-spacing="1.5" fill="#4E7A8C">ONGOING</text>
</svg>
