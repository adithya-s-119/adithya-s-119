<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Status light">
  <defs>
    <style>
      .dot {
        animation: pulse 2.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
    </style>
  </defs>
  <circle cx="9" cy="9" r="7" fill="none" stroke="#00E5FF" stroke-opacity="0.3"/>
  <circle class="dot" cx="9" cy="9" r="3" fill="#00E5FF"/>
  <circle cx="9" cy="9" r="1.2" fill="#E8FAFF"/>
</svg>
